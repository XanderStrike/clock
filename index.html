<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>Links</h3>
      <button id="manage-links-btn">⚙️</button>
    </div>
    <div class="links-container" id="links-container">
      <!-- Links will be populated here -->
    </div>
  </aside>
  
  <main class="container">
    <div class="city" id="utc">
      <div class="city-name">UTC</div>
      <div class="time">--:--:--</div>
    </div>
    <div class="city" id="toronto">
      <div class="city-name">Toronto</div>
      <div class="time">--:--:--</div>
    </div>
    <div class="city" id="los-angeles">
      <div class="city-name">Los Angeles</div>
      <div class="time">--:--:--</div>
    </div>
  </main>

  <div class="converter" id="converter">
    <button id="toggle">Convert Time</button>
    <form id="conv-form" style="display:none;">
      <div class="form-group">
        <label for="base-time">Time (HH:MM) or Unix timestamp</label>
        <input type="text" id="base-time" placeholder="HH:MM or 1700000000" pattern="^([01]?[0-9]|2[0-3]):[0-5][0-9]$|^[0-9]{9,}$" required />
        <div class="error" id="time-error">Please enter a valid time (HH:MM) or Unix timestamp</div>
      </div>
      <div class="form-group">
        <label for="base-zone">From Time Zone (optional for unix timestamps)</label>
        <select id="base-zone">
          <option value="">Select time zone</option>
        </select>
      </div>
      <div class="form-group">
        <button type="submit">Convert Time</button>
      </div>
      <div class="results empty" id="conv-results">Results will appear here</div>
    </form>
  </div>

  <div class="settings">
    <button id="settings-btn">⚙️ Settings</button>
  </div>

  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Time Zone Settings</h2>
        <button id="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="timezone-list" id="timezone-list"></div>
        <button id="add-timezone">+ Add Time Zone</button>
        <div class="modal-actions">
          <button id="save-settings">Save</button>
          <button id="cancel-settings">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="links-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Manage Links</h2>
        <button id="close-links-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="links-list" id="links-list"></div>
        <button id="add-link">+ Add Link</button>
        <div class="modal-actions">
          <button id="save-links">Save</button>
          <button id="cancel-links">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
